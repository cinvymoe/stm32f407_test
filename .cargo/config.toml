[target.thumbv7em-none-eabihf]
# runner = "arm-none-eabi-gdb -q -x openocd.gdb"
runner = "probe-rs run --chip STM32F407VG --protocol swd"
rustflags = [
  "-C",
  "link-arg=--nmagic",
  "-C",
  "link-arg=-Tlink.x",
  "-C",
  "link-arg=-Tdefmt.x",
]
[build]
target = "thumbv7em-none-eabihf"

# 使用此配置可以在没有标准库的情况下进行调试
[target.'cfg(all(target_arch = "arm", target_os = "none"))']

[env]
DEFMT_LOG = "trace"
