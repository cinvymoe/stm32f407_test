[target.thumbv7em-none-eabihf]
# Use probe-rs for flashing and debugging
runner = "probe-rs run --chip STM32F407VG --protocol swd"

rustflags = [
  "-C",
  "link-arg=--nmagic",
  "-C",
  "link-arg=-Tlink.x",
  "-C",
  "link-arg=-Tdefmt.x",
  # Optimize for size
  "-C",
  "inline-threshold=5",
  "-C",
  "no-vectorize-loops",
]

[build]
target = "thumbv7em-none-eabihf"

# Environment variables
[env]
# Set defmt log level (trace, debug, info, warn, error)
DEFMT_LOG = "info"
