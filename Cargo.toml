[package]
name = "stm32f407_test"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
defmt = { version = "1.0" }
defmt-rtt = "1.0"

# Embassy dependencies
embassy-executor = { version = "0.7.0", features = [
    "arch-cortex-m",
    "executor-thread",
] }
embassy-time = { version = "0.4.0", features = ["tick-hz-1_000"] }
embassy-stm32 = { version = "0.2.0", features = [
    "stm32f407vg",
    "time-driver-any",
    "exti",
] }
embassy-sync = { version = "0.6.2" }
static_cell = "2.1.0"
futures = { version = "0.3.28", default-features = false }

[profile.release]
opt-level = "s"
lto = true
debug = true

[profile.dev]
debug = true
lto = true
opt-level = 0

# Prevents multiple copies of panic handlers
[profile.dev.package.panic-halt]
opt-level = 3

# Prevents multiple copies of core libraries
[profile.dev.package.cortex-m]
opt-level = 3

[profile.dev.package.cortex-m-rt]
opt-level = 3
