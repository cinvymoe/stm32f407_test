[package]
name = "stm32f407-sd-bootloader"
version = "0.1.0"
edition = "2021"

[dependencies]
# Embassy async runtime and HAL
embassy-executor = { version = "0.6", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
    "integrated-timers",
] }
embassy-time = { version = "0.3", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-stm32 = { version = "0.1", features = [
    "stm32f407vg",
    "defmt",
    "time-driver-any",
    "exti",
    "memory-x",
] }
embassy-boot-stm32 = { version = "0.2", features = ["defmt"] }

# Async utilities
embassy-sync = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"

# Cortex-M support
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"

# Panic and logging
panic-probe = { version = "0.3", features = ["print-defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"

# SD card and filesystem
embedded-sdmmc = { version = "0.8", default-features = false }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-storage = "0.3"
embedded-storage-async = "0.4"

# CRC calculation
crc = { version = "3.0", default-features = false }

# Utilities
heapless = "0.8"
static_cell = "2"

[profile.release]
opt-level = "s"
lto = true
debug = true

[profile.dev]
debug = true
lto = true
opt-level = 0

# Prevents multiple copies of panic handlers
[profile.dev.package.panic-halt]
opt-level = 3

# Prevents multiple copies of core libraries
[profile.dev.package.cortex-m]
opt-level = 3

[profile.dev.package.cortex-m-rt]
opt-level = 3

[[example]]
name = "sd_card_test"
required-features = []
